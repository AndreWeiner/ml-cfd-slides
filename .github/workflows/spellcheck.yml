# Codespell configuration is within .codespellrc
---
name: Spellcheck

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Codespell
        run: python -m pip install codespell==2.4.3
      - name: Codespell
        run: codespell
